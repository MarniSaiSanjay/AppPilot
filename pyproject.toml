[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apppilot"
version = "0.1.0"
description = "Goal-driven Android regression testing automation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "azure-identity==1.25.3",
    "azure-keyvault-secrets==4.10.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit==2.10.1",
    "pyflakes==3.4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
