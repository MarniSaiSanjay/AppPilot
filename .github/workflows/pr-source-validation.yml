name: PR source validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-source-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
            email_service/requirements.txt

      - name: Install declared dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Validate Python syntax
        run: python -m compileall -q src tests scripts email_service

      - name: Run full unit suite
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Run strict pyflakes
        run: python -m pyflakes src tests scripts email_service

      - name: Validate tracked workbook
        run: python scripts/validate_workbook.py

      - name: Scan source for committed secrets
        run: python scripts/scan_secrets.py

      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "${BASE_SHA}" ]]; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git show --check --oneline --no-renames HEAD
          fi

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            email_service/requirements.txt

      - name: Install dependency auditor
        run: python -m pip install --disable-pip-version-check 'pip-audit==2.10.1'

      - name: Audit email relay runtime dependencies
        run: >-
          python -m pip_audit
          -r email_service/requirements.txt
          --progress-spinner off

  email-container:
    name: Email relay container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build email relay image
        run: docker build --tag apppilot-email-relay:pr ./email_service
